<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>本地 HTML 预览</title>
  <link rel="stylesheet" href="styles/preview.css">
</head>
<body>
  <main>
    <div class="eyebrow">MD PREVIEW / LOCAL DOCUMENTS</div>
    <header><div><h1>文档，直接预览。</h1><p>Markdown 是主角，相关的 HTML 笔记也可以留在同一个阅读空间。</p></div><img src="images/md-preview.png" alt="MD Preview" width="128" height="128"></header>
    <section><h2>保留熟悉的排版</h2><p>文字、表格、内嵌样式与本地图片，按文档原本的结构展示。阅读器的目录与工具栏保持独立。</p>
      <table><thead><tr><th>内容</th><th>预览方式</th></tr></thead><tbody><tr><td>Markdown</td><td>标题、表格、代码高亮与 Mermaid</td></tr><tr><td>HTML</td><td>静态页面与本地 CSS</td></tr><tr><td>图片</td><td>本地位图与相对路径</td></tr></tbody></table>
    </section>
    <section><h2>保持纯本地</h2><p>这份示例只使用本地文件。预览不运行文档脚本，也不加载外部字体或远程资源。</p></section>
  </main>
</body>
</html>
